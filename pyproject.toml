[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-devkit-oss"
version = "0.1.0"
description = "Read-only static inspection tools for Oracle APEX developers"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "APEX DevKit OSS contributors"}]
dependencies = []

[project.scripts]
apex-devkit = "apex_devkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
